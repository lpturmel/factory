<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Dashboard</title>
<meta name="description" content="Static design mockup of the factory dashboard: all factories, one factory's pipeline board, one job's detail. Sample data only.">
<style>
/* ============ Tokens (see DESIGN.md §4) ============ */
:root {
  color-scheme: light;
  --bg: #f7f8fa; --surface: #ffffff; --sunken: #eef0f3; --hover: #f1f3f6;
  --border: #dfe2e7; --border-strong: #c7ccd4;
  --text: #16181d; --text-muted: #565d6b; --text-faint: #636a76;
  --accent: #1f56c7; --focus: #1f56c7;

  --st-attn: #b3261e;  --st-attn-tint: #fdecea;  --st-attn-line: #f2b8b3;
  --st-warn: #8a4b00;  --st-warn-tint: #fdf1dc;  --st-warn-line: #ecc98a;
  --st-run: #1f56c7;   --st-run-tint: #e8effc;   --st-run-line: #b6c9f2;
  --st-ok: #17733a;    --st-ok-tint: #e5f4ea;    --st-ok-line: #a9d8b8;
  --st-mute: #535a66;  --st-mute-tint: #eceef1;  --st-mute-line: #cfd3da;
  --st-stale: #6b4fa8; --st-stale-tint: #f0ebfa; --st-stale-line: #cdbdf0;

  --font-ui: ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-lg: 15px; --fs-xl: 18px;
  --lh: 1.45;
  --sp-1: 2px; --sp-2: 4px; --sp-3: 8px; --sp-4: 12px; --sp-5: 16px; --sp-6: 24px; --sp-7: 32px;
  --radius-sm: 3px; --radius: 6px; --radius-lg: 8px;
  --shadow-pop: 0 8px 28px rgba(16,24,40,.18);
  --dur: 120ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1014; --surface: #161920; --sunken: #1d2129; --hover: #1c2028;
    --border: #2a2f39; --border-strong: #3a404c;
    --text: #e5e7eb; --text-muted: #a3abb8; --text-faint: #8b93a1;
    --accent: #8cb4ff; --focus: #8cb4ff;
    --st-attn: #ff8a80;  --st-attn-tint: #3a1614;  --st-attn-line: #6e2a25;
    --st-warn: #f0b85a;  --st-warn-tint: #33240b;  --st-warn-line: #6b4c14;
    --st-run: #8cb4ff;   --st-run-tint: #14223d;   --st-run-line: #2c4677;
    --st-ok: #6fd18f;    --st-ok-tint: #10291a;    --st-ok-line: #24553a;
    --st-mute: #aab1bd;  --st-mute-tint: #22262e;  --st-mute-line: #3a404c;
    --st-stale: #c3a6ff; --st-stale-tint: #251c3b; --st-stale-line: #4a3a78;
    --shadow-pop: 0 8px 28px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1014; --surface: #161920; --sunken: #1d2129; --hover: #1c2028;
  --border: #2a2f39; --border-strong: #3a404c;
  --text: #e5e7eb; --text-muted: #a3abb8; --text-faint: #8b93a1;
  --accent: #8cb4ff; --focus: #8cb4ff;
  --st-attn: #ff8a80;  --st-attn-tint: #3a1614;  --st-attn-line: #6e2a25;
  --st-warn: #f0b85a;  --st-warn-tint: #33240b;  --st-warn-line: #6b4c14;
  --st-run: #8cb4ff;   --st-run-tint: #14223d;   --st-run-line: #2c4677;
  --st-ok: #6fd18f;    --st-ok-tint: #10291a;    --st-ok-line: #24553a;
  --st-mute: #aab1bd;  --st-mute-tint: #22262e;  --st-mute-line: #3a404c;
  --st-stale: #c3a6ff; --st-stale-tint: #251c3b; --st-stale-line: #4a3a78;
  --shadow-pop: 0 8px 28px rgba(0,0,0,.55);
}

/* ============ Base ============ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: var(--fs-md)/var(--lh) var(--font-ui); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-sm); }
button { font: inherit; color: inherit; }
.mono { font-family: var(--font-mono); font-size: 0.95em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.faint { color: var(--text-faint); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { margin: 0; font-weight: 600; }
h1 { font-size: var(--fs-xl); }
h2 { font-size: var(--fs-lg); }
h3 { font-size: var(--fs-md); }

/* ============ App shell ============ */
.topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: var(--sp-4); padding: var(--sp-3) var(--sp-5); background: var(--surface); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: var(--sp-3); font-weight: 600; color: var(--text); }
.brand-mark { width: 18px; height: 18px; border-radius: 4px; background: linear-gradient(135deg, var(--st-run) 0 50%, var(--st-ok) 50% 100%); }
.crumbs { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; color: var(--text-muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.crumbs a { color: var(--text-muted); }
.crumbs .sep { color: var(--text-faint); }
.crumbs [aria-current] { color: var(--text); font-weight: 500; }
.topbar .spacer { flex: 1; }
.poll { display: flex; align-items: center; gap: var(--sp-2); color: var(--text-muted); font-size: var(--fs-sm); white-space: nowrap; }
.poll .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--st-ok); }
.poll.is-paused .pulse { background: var(--st-mute); }
.poll.is-error .pulse { background: var(--st-attn); }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 28px; height: 28px; padding: 0 var(--sp-3); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: var(--fs-sm); color: var(--text-muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.attn-count { display: inline-flex; align-items: center; gap: var(--sp-2); padding: 2px var(--sp-3); border-radius: 999px; background: var(--st-attn-tint); color: var(--st-attn); border: 1px solid var(--st-attn-line); font-weight: 600; font-size: var(--fs-sm); white-space: nowrap; }
.attn-count:hover { text-decoration: none; filter: brightness(0.98); }

.mock-bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-5); background: var(--sunken); border-bottom: 1px dashed var(--border-strong); font-size: var(--fs-xs); color: var(--text-muted); }
.mock-bar strong { color: var(--text); font-weight: 600; }
.mock-bar button { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius-sm); padding: 1px var(--sp-3); cursor: pointer; font-size: var(--fs-xs); color: var(--text-muted); }
.mock-bar button[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }

main { padding: var(--sp-5); max-width: 1480px; margin: 0 auto; }
.section { margin-bottom: var(--sp-6); }
.section-head { display: flex; align-items: baseline; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.section-head .count { color: var(--text-faint); font-size: var(--fs-sm); }
.section-head .spacer { flex: 1; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }

/* ============ Status primitives ============ */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; height: 20px; border-radius: var(--radius-sm); font-size: var(--fs-xs); font-weight: 600; letter-spacing: .01em; white-space: nowrap; border: 1px solid transparent; }
.badge .glyph { font-size: 9px; line-height: 1; }
.tone-attn  { color: var(--st-attn);  background: var(--st-attn-tint);  border-color: var(--st-attn-line); }
.tone-warn  { color: var(--st-warn);  background: var(--st-warn-tint);  border-color: var(--st-warn-line); }
.tone-run   { color: var(--st-run);   background: var(--st-run-tint);   border-color: var(--st-run-line); }
.tone-ok    { color: var(--st-ok);    background: var(--st-ok-tint);    border-color: var(--st-ok-line); }
.tone-mute  { color: var(--st-mute);  background: var(--st-mute-tint);  border-color: var(--st-mute-line); }
.tone-stale { color: var(--st-stale); background: var(--st-stale-tint); border-color: var(--st-stale-line); }
.chip { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 999px; font-size: var(--fs-xs); color: var(--text-muted); background: var(--sunken); border: 1px solid var(--border); white-space: nowrap; }
.risk { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-xs); font-weight: 600; white-space: nowrap; }
.risk .bars { display: inline-flex; gap: 1px; align-items: flex-end; }
.risk .bars i { display: block; width: 3px; background: var(--border-strong); border-radius: 1px; }
.risk .bars i:nth-child(1) { height: 5px; } .risk .bars i:nth-child(2) { height: 8px; } .risk .bars i:nth-child(3) { height: 11px; }
.risk.low { color: var(--text-muted); } .risk.low .bars i:nth-child(-n+1) { background: var(--text-muted); }
.risk.medium { color: var(--st-warn); } .risk.medium .bars i:nth-child(-n+2) { background: var(--st-warn); }
.risk.high { color: var(--st-attn); } .risk.high .bars i:nth-child(-n+3) { background: var(--st-attn); }
.model { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-faint); }
.rev { display: inline-flex; align-items: center; gap: 3px; height: 18px; padding: 0 5px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: var(--fs-xs); background: var(--surface); white-space: nowrap; }
.rev .v { font-weight: 700; }
.rev.pass { border-color: var(--st-ok-line); } .rev.pass .v { color: var(--st-ok); }
.rev.changes { border-color: var(--st-warn-line); } .rev.changes .v { color: var(--st-warn); }
.rev.running .v { color: var(--st-run); }

/* ============ Attention list ============ */
.attention { border: 1px solid var(--st-attn-line); border-left: 4px solid var(--st-attn); background: var(--surface); border-radius: var(--radius-lg); overflow: hidden; }
.attention-head { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); background: var(--st-attn-tint); color: var(--st-attn); font-weight: 600; }
.attention-head .spacer { flex: 1; }
.attention-head .hint { font-weight: 400; color: var(--text-muted); font-size: var(--fs-sm); }
.attn-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: var(--sp-4); align-items: start; padding: var(--sp-3) var(--sp-4); border-top: 1px solid var(--border); color: inherit; }
.attn-row:hover { background: var(--hover); text-decoration: none; }
.attn-row .what { min-width: 0; }
.attn-row .title { font-weight: 600; color: var(--text); }
.attn-row .why { color: var(--text-muted); margin-top: 2px; }
.attn-row .ask { margin-top: 4px; color: var(--text); font-size: var(--fs-sm); padding-left: var(--sp-3); border-left: 2px solid var(--border-strong); }
.attn-row .meta { text-align: right; font-size: var(--fs-sm); color: var(--text-muted); white-space: nowrap; }
.attn-row .meta .next { display: block; margin-top: 2px; color: var(--accent); }
.attention.watch { border-color: var(--st-warn-line); border-left-color: var(--st-warn); margin-top: var(--sp-3); }
.attention.watch .attention-head { background: var(--st-warn-tint); color: var(--st-warn); }
.attn-row.compact { padding-top: 6px; padding-bottom: 6px; }
.attn-row.compact .why { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attention-clear { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4); border: 1px solid var(--st-ok-line); background: var(--st-ok-tint); color: var(--st-ok); border-radius: var(--radius-lg); font-weight: 500; }

/* ============ Factories table ============ */
.table-wrap { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
.grid th { text-align: left; font-weight: 500; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); white-space: nowrap; }
.grid th.r, .grid td.r { text-align: right; }
.grid td { padding: var(--sp-3) var(--sp-4); border-bottom: 1px solid var(--border); vertical-align: top; }
.grid tbody tr:last-child td { border-bottom: 0; }
.grid tbody tr { cursor: pointer; }
.grid tbody tr:hover td { background: var(--hover); }
.grid tr.is-attn td:first-child { box-shadow: inset 3px 0 0 var(--st-attn); }
.grid tr.is-stale td:first-child { box-shadow: inset 3px 0 0 var(--st-stale); }
.grid tr.is-error td:first-child { box-shadow: inset 3px 0 0 var(--st-attn); }
.fname { font-weight: 600; color: var(--text); }
.fpath { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-faint); }
.stage-mini { display: flex; flex-wrap: wrap; gap: 4px; }
.stage-mini .chip b { color: var(--text); font-weight: 600; margin-left: 3px; }
.waiting { display: flex; flex-direction: column; gap: 2px; }
.spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 18px; vertical-align: middle; margin-left: var(--sp-3); }
.spark i { display: block; width: 4px; background: var(--st-ok); opacity: .75; border-radius: 1px 1px 0 0; }
.spark i.zero { height: 1px !important; background: var(--border-strong); }
.err-text { color: var(--st-attn); font-size: var(--fs-sm); }
.f-cards { display: none; }

/* ============ Factory header / stats ============ */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: var(--sp-4); margin-bottom: var(--sp-5); }
.page-head .titles { min-width: 0; flex: 1 1 320px; }
.page-head .sub { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-2); color: var(--text-muted); font-size: var(--fs-sm); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(110px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: var(--sp-5); }
.stat { background: var(--surface); padding: var(--sp-3) var(--sp-4); }
.stat .label { font-size: var(--fs-xs); color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; }
.stat .value { font-size: var(--fs-xl); font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat .value.attn { color: var(--st-attn); }
.stat .delta { font-size: var(--fs-xs); color: var(--text-muted); }

.banner { display: flex; gap: var(--sp-3); align-items: flex-start; padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-lg); margin-bottom: var(--sp-5); border: 1px solid; }
.banner .b-title { font-weight: 600; }
.banner .b-body { color: var(--text); font-size: var(--fs-sm); margin-top: 2px; }
.banner code { font-family: var(--font-mono); font-size: var(--fs-sm); background: var(--surface); padding: 0 4px; border-radius: var(--radius-sm); border: 1px solid var(--border); color: var(--text); }

/* ============ Board ============ */
.board-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-3); margin-bottom: var(--sp-3); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 3px var(--sp-4); cursor: pointer; font-size: var(--fs-sm); color: var(--text-muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--sunken); color: var(--text); font-weight: 600; }
.board { display: grid; grid-template-columns: var(--cols); gap: var(--sp-3); overflow-x: auto; padding-bottom: var(--sp-3); }
.lane { background: var(--sunken); border-radius: var(--radius-lg); padding: var(--sp-3); min-height: 120px; display: flex; flex-direction: column; gap: var(--sp-3); }
.lane-head { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); padding: 0 2px; }
.lane-head .n { margin-left: auto; color: var(--text-faint); font-variant-numeric: tabular-nums; }
.lane-head .kind { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--text-faint); }
.lane.is-attn { background: var(--st-attn-tint); outline: 1px solid var(--st-attn-line); }
.lane.is-attn .lane-head { color: var(--st-attn); }
.lane.is-warn { background: var(--st-warn-tint); outline: 1px solid var(--st-warn-line); }
.lane.is-warn .lane-head { color: var(--st-warn); }
.lane.is-empty .lane-head { flex-wrap: wrap; row-gap: 0; }
.lane.is-empty { background: transparent; border: 1px dashed var(--border); }
.lane-empty { color: var(--text-faint); font-size: var(--fs-sm); padding: var(--sp-3) 2px; }
.card { display: block; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--sp-3); color: inherit; }
.card:hover { border-color: var(--border-strong); text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.card.flag-attn { border-left: 3px solid var(--st-attn); }
.card.flag-warn { border-left: 3px solid var(--st-warn); }
.card-top { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--text-faint); }
.card-top .spacer { flex: 1; }
.card-title { font-weight: 600; margin: 4px 0 6px; color: var(--text); line-height: 1.3; }
.card-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 4px; }
.card-foot { display: flex; align-items: center; white-space: nowrap; gap: var(--sp-3); margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--border); font-size: var(--fs-xs); color: var(--text-muted); font-variant-numeric: tabular-nums; }
.card-foot .spacer { flex: 1; }
.card-flag { margin-top: 6px; font-size: var(--fs-xs); font-weight: 600; }
.card-flag.attn { color: var(--st-attn); } .card-flag.warn { color: var(--st-warn); }
.rounds { display: inline-flex; gap: 2px; align-items: center; }
.rounds i { width: 7px; height: 7px; border-radius: 2px; border: 1px solid var(--border-strong); }
.rounds i.used { background: var(--text-muted); border-color: var(--text-muted); }
.rounds i.used.last { background: var(--st-attn); border-color: var(--st-attn); }
.done-list { margin-top: var(--sp-5); }
.done-list .grid td { padding: 6px var(--sp-4); }

/* ============ Job view ============ */
.job-layout > *, .tl-item, .filecard { min-width: 0; }
.job-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--sp-5); align-items: start; }
.facts { display: grid; grid-template-columns: repeat(6, auto); justify-content: start; gap: var(--sp-2) var(--sp-6); margin-top: var(--sp-3); font-size: var(--fs-sm); }
.facts dt { color: var(--text-faint); font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: .04em; }
.facts dd { margin: 0; font-variant-numeric: tabular-nums; }
.links { display: flex; gap: var(--sp-3); flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: var(--sp-2); height: 28px; padding: 0 var(--sp-4); border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); font-size: var(--fs-sm); cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); text-decoration: none; }

.pipeline { display: flex; gap: 2px; margin: var(--sp-4) 0 var(--sp-5); overflow-x: auto; }
.pipe { flex: 1 1 0; min-width: 64px; padding: 4px 6px; font-size: var(--fs-xs); text-align: center; background: var(--sunken); color: var(--text-faint); white-space: nowrap; }
.pipe:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.pipe:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.pipe.done { background: var(--st-ok-tint); color: var(--st-ok); }
.pipe.current { background: var(--st-run-tint); color: var(--st-run); font-weight: 700; box-shadow: inset 0 -2px 0 var(--st-run); }
.pipe.current.attn { background: var(--st-attn-tint); color: var(--st-attn); box-shadow: inset 0 -2px 0 var(--st-attn); }

.timeline { list-style: none; margin: 0; padding: 0; }
.tl-item { position: relative; padding: 0 0 var(--sp-5) 28px; }
.tl-item::before { content: ""; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--border); }
.tl-item:last-child::before { display: none; }

function ago(ms) {
  const d = NOW - ms;
  if (d < min) return Math.round(d/1e3) + "s ago";
  if (d < hr) return Math.round(d/min) + "m ago";
  if (d < day) return Math.floor(d/hr) + "h " + Math.round((d%hr)/min) + "m ago";
  return Math.floor(d/day) + "d " + Math.floor((d%day)/hr) + "h ago";
}
function dur(ms) {
  if (ms == null) return "—";
  if (ms < min) return Math.round(ms/1e3) + "s";
  if (ms < hr) return Math.round(ms/min) + "m";
  if (ms < day) return Math.floor(ms/hr) + "h " + String(Math.round((ms%hr)/min)).padStart(2,"0") + "m";
  return Math.floor(ms/day) + "d " + Math.floor((ms%day)/hr) + "h";
}
const usd = (n) => "$" + n.toFixed(2);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ATTN_RANK = { "error":0, "max-rounds":1, "escalated":2, "gate":3, "needs-info":4 };
function attentionItems(fid) {
  const items = jobs.filter(j => j.attention && (!fid || j.f === fid))
    .map(j => ({ job:j, f:fById[j.f], kind:j.attention.kind, since:j.entered }));
  if (!fid) factories.filter(f => f.run.state === "error").forEach(f => items.push({ f, kind:"error", since:null }));
  return items.sort((a,b) => ATTN_RANK[a.kind]-ATTN_RANK[b.kind] || a.since-b.since);
}
const KIND_BADGE = {
  "max-rounds": ["tone-attn","▲","Max rounds"],
  "escalated":  ["tone-attn","▲","Needs human"],
  "gate":       ["tone-warn","◆","Gate failing"],
  "needs-info": ["tone-warn","?","Needs info"],
  "error":      ["tone-attn","✕","Unreadable"],
};
const NEXT = {
  "max-rounds": (j) => "Decide · /factory feedback " + j.id,
  "escalated":  (j) => j.pr ? "Review PR #" + j.pr.n : "Decide",
  "gate":       (j) => "Watch round " + j.round + "/" + j.maxRounds,
  "needs-info": (j) => j.src.startsWith("#") ? "Author replies on issue " + j.src : "Answer in " + j.src.split("/").pop(),
};
function stageTone(s) {
  return { "needs-human":"tone-attn", "needs-info":"tone-warn", "merged":"tone-ok", "rejected":"tone-mute" }[s] || "tone-run";
}
const STAGE_GLYPH = { "needs-human":"▲", "needs-info":"?", "merged":"✓", "rejected":"✕" };
const stageBadge = (s) => `<span class="badge ${stageTone(s)}"><span class="glyph" aria-hidden="true">${STAGE_GLYPH[s] || "●"}</span>${s}</span>`;
const RUN_BADGE = {
  running: ["tone-run","●","Running"], idle: ["tone-mute","○","Idle"], stopped: ["tone-stale","■","Stopped"], error: ["tone-attn","✕","Error"],
};
const runBadge = (f) => { const [c,g,l] = RUN_BADGE[f.run.state]; return `<span class="badge ${c}"><span class="glyph" aria-hidden="true">${g}</span>${l}</span>`; };
const riskEl = (r) => r ? `<span class="risk ${r}" title="Risk ${r}"><span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>${r}</span>` : `<span class="faint" style="font-size:var(--fs-xs)">unrated</span>`;
const short = (n) => n.replace(/-reviewer$/, "");
const revEl = (r, state) => `<span class="rev ${state||""}" title="${esc(r.name)} reviewer on ${r.model}${state ? ": " + state : ""}">${state === "pass" ? '<span class="v">✓</span>' : state === "changes" ? '<span class="v">!</span>' : state === "running" ? '<span class="v">●</span>' : ""}${esc(short(r.name))} <span class="model">${r.model}</span></span>`;
const roundsEl = (j) => j.round ? `<span class="rounds" aria-hidden="true">${Array.from({length:j.maxRounds},(_,i)=>`<i class="${i<j.round?"used":""}${i===j.round-1 && j.round===j.maxRounds?" last":""}"></i>`).join("")}</span> <span title="Round ${j.round} of ${j.maxRounds}"><span class="sr-only">Round </span>R${j.round}/${j.maxRounds}</span>` : `<span>—</span>`;
const srcLink = (j) => { const f = fById[j.f]; return f.backlog.kind === "github" ? `<a href="#" onclick="return false">${f.backlog.label}${j.src}</a>` : `<a href="#" onclick="return false" class="mono">${esc(j.src)}</a>`; };

function viewAttention(fid) {

function stageCounts(fid) {
  const c = {}; jobsOf(fid).forEach(j => { if (ACTIVE.includes(j.stage)) c[j.stage] = (c[j.stage]||0)+1; });

const sparkEl = (arr) => { const m = Math.max(1,...arr); return `<span class="spark" aria-hidden="true">${arr.map(v => `<i class="${v?"":"zero"}" style="height:${Math.max(2, v/m*18)}px"></i>`).join("")}</span>`; };
function rowClass(f) { if (f.run.state === "error") return "is-error"; if (attentionItems(f.id).length) return "is-attn"; if (f.run.state === "stopped") return "is-stale"; return ""; }
function runCell(f) {

      <div class="stat"><div class="label">In flight</div><div class="value">${js.filter(j=>ACTIVE.includes(j.stage)).length}</div><div class="delta">${f.run.concurrency ? "of " + f.run.concurrency + " slots" : "not running"}</div></div>
      <div class="stat"><div class="label">Merged 7d</div><div class="value">${f.week.merged}</div><div class="delta">${f.week.rejected} rejected</div></div>
      <div class="stat"><div class="label">Spend 7d</div><div class="value">${usd(f.week.spend)}</div><div class="delta">${usd(spendOpen)} on open jobs</div></div>
      <div class="stat"><div class="label">Median job</div><div class="value">${fid === "tidepool" ? "3h 40m" : fid === "ledgerline" ? "1h 55m" : "—"}</div><div class="delta">${fid === "tidepool" ? "$5.15 · 1.8 rounds" : fid === "ledgerline" ? "$2.30 · 1.4 rounds" : "no merged jobs"}</div></div>
    </div>
    ${att ? `<div class="section">${viewAttention(fid)}</div>` : ""}
    <section class="section" aria-labelledby="pH">
      <div class="board-toolbar"><h2 id="pH">Pipeline</h2><span class="faint" style="font-size:var(--fs-sm)">${open.length} open</span><span style="flex:1"></span>
        <div class="seg" role="group" aria-label="Layout"><button type="button" aria-pressed="${boardMode==="board"}" onclick="boardMode='board';render()">Board</button><button type="button" aria-pressed="${boardMode==="table"}" onclick="boardMode='table';render()">Table</button></div></div>
      ${open.length ? (boardMode === "board" ? board : table) : `<div class="panel state-box"><h2>No open jobs</h2><p>Jobs appear here when <code>/factory run</code> picks up a ready backlog item.</p></div>`}
    </section>
    ${done.length ? doneHtml : ""}`;
}

function verdictEl(v) {
  const label = { pass:"PASS", changes:"CHANGES", skip:"not run", running:"running" }[v] || "—";
  return `<span class="verdict ${v||"skip"}">${label}</span>`;
}

function genericTimeline(j) {
  const idx = FLOW.indexOf(j.stage);
  const items = [];
  const upto = j.stage === "needs-human" ? FLOW.indexOf("approve") : j.stage === "needs-info" || j.stage === "rejected" ? 0 : idx;
  for (let i = 0; i <= Math.max(0, upto); i++) {
    const s = FLOW[i]; const current = i === upto && !["needs-human","needs-info","rejected","merged"].includes(j.stage);
    items.push({ stage:s, agent: s === "gate" || s === "merging" ? "script" : s, model: {intake:"fable",spec:"opus",build:"opus",approve:"opus"}[s] || (s==="review" ? "" : "script"),
      at: j.created + (j.entered - j.created) * (i/(upto+1)), tone: current ? "run" : "ok", verdict: current ? "running" : "", file: current ? null : (s==="review" ? "review-code-1.md" : s + (s==="build"||s==="gate" ? "-1" : "") + (s==="gate"?".log":".md")),
      summary: current ? [] : ["Summary bullets from this stage's file appear here (3–5 bullets)."] });
  }
  if (["needs-human","needs-info","rejected","merged"].includes(j.stage)) items.push({ stage:j.stage, agent:"job", model:"script", at:j.entered, tone: j.stage==="merged" ? "ok" : j.stage==="rejected" ? "mute" : j.stage==="needs-info" ? "warn" : "attn", verdict:"", file: j.stage==="merged" ? "approve.md" : j.stage==="needs-info" ? "intake.md" : "escalation.md", summary: j.attention ? [j.attention.ask] : j.rejectWhy ? [j.rejectWhy] : ["Merged."] });
  return items;
}

function viewJob(fid, jid) {
  const f = fById[fid]; const j = jobs.find(x => x.id === jid && x.f === fid);
  if (!f || !j) return viewNotFound();
  const d = detail[jid];
  const tl = d ? d.timeline : genericTimeline(j);
  if (d && !d._timed) { // sample data: lay steps end to end from job creation (real data reads timestamps from job.json)
    let cur = j.created;
    tl.forEach(it => { if (it.round) return; if (it.stage === "needs-human" || it.tone === "run") { it.at = j.entered; return; } it.at = cur; cur += (it.dur || 0) + min; });
    d._timed = true;
  }
  const flowIdx = j.stage === "needs-human" ? FLOW.indexOf("approve") : FLOW.indexOf(j.stage);
  const pipe = FLOW.map((s,i) => {
    let cls = i < flowIdx ? "done" : i === flowIdx ? "current" : "";
    if (j.stage === "merged") cls = "done";
    if (i === flowIdx && j.stage === "needs-human") cls += " attn";
    const label = i === flowIdx && j.stage === "needs-human" ? "approve ▲ needs-human" : s;
    return `<div class="pipe ${cls}"${i===flowIdx ? ' aria-current="step"' : ""}>${label}</div>`;
  }).join("");

  const items = tl.map(it => {
    if (it.round) return `<li class="round-sep" aria-hidden="false">Round ${it.round}</li>`;
    const dot = { ok:"✓", warn:"!", attn: it.stage === "gate" ? "✕" : "▲", run:"●", mute:"✕" }[it.tone];
    const key = jid + ":" + it.file;
    return `<li class="tl-item"><span class="tl-dot ${it.tone}" aria-hidden="true">${dot}</span>
      <div class="tl-head"><span class="stage-name">${it.stage}</span><span class="muted" style="font-size:var(--fs-sm)">${esc(it.agent)}${it.model ? ` <span class="model">${it.model}</span>` : ""}</span>
        ${it.verdict ? `<span class="badge tone-${it.tone}">${esc(it.verdict)}</span>` : ""}
        ${it.reviews ? Object.entries(it.reviews).map(([n,v]) => `<span class="rev ${v}"><span class="v">${v==="pass"?"✓":v==="changes"?"!":"–"}</span>${short(n)}</span>`).join("") : ""}
        <span class="spacer"></span><span class="when">${new Date(it.at).toISOString().slice(11,16)} UTC · ${it.dur ? dur(it.dur) : it.tone === "run" ? "running " + dur(NOW-it.at) : ""}</span></div>
      ${it.file ? `<div class="filecard"><div class="filecard-head"><span class="fn">${it.file}</span><span class="faint">## Summary</span><span class="spacer"></span><button type="button" class="link" data-file="${esc(it.file)}" data-job="${jid}" data-summary="${esc(JSON.stringify(it.summary))}">Open full file</button></div>
        <ul>${it.summary.map(s => `<li>${esc(s)}</li>`).join("")}</ul>
        ${it.gatelog && GATELOGS[jid + ":" + it.log] ? `<div class="filecard-head" style="border-top:1px solid var(--border)"><span class="fn">${it.log}</span><span class="faint">tail</span><span class="spacer"></span><button type="button" class="link" data-file="${esc(it.log)}" data-job="${jid}" data-summary="[]">Open full log</button></div><pre class="gatelog" aria-label="Gate log tail">${GATELOGS[jid + ":" + it.log]}</pre>` : ""}</div>`
        : it.source ? `<div class="filecard"><div class="filecard-head"><span class="fn">${esc(it.source)}</span></div><ul>${it.summary.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`
        : it.tone === "run" ? `<div class="filecard"><div style="padding:10px 12px"><span class="skel" style="width:60%"></span><span class="skel" style="width:40%;margin-top:6px"></span><div class="faint" style="font-size:var(--fs-xs);margin-top:8px">builder is writing build-${j.round}.md · summary appears when the file lands</div></div></div>` : ""}
    </li>`;
  }).join("");

  const m = d ? d.matrix : { reviewers: j.reviewers.map(r=>r.name), rounds: j.round ? Array.from({length:j.round},(_,i)=> Object.fromEntries(j.reviewers.map(r => [r.name, i===j.round-1 && j.live ? j.live[r.name] : i===j.round-1 ? "skip" : "changes"]))) : [] };
  const modelOf = (n) => (j.reviewers.find(r=>r.name===n)||{}).model || "";
  const matrix = m.rounds.length ? `<table class="matrix"><caption class="sr-only">Reviewer verdicts per round</caption><thead><tr><th scope="col">Reviewer</th>${m.rounds.map((_,i)=>`<th scope="col">R${i+1}</th>`).join("")}</tr></thead><tbody>
    ${m.reviewers.map(n => `<tr><th scope="row" style="font-weight:500">${short(n)} <span class="model">${modelOf(n)}</span></th>${m.rounds.map((r,i) => `<td>${["pass","changes"].includes(r[n]) ? `<button type="button" class="verdict-btn" data-file="review-${i+1}-${n}.md" data-job="${jid}" data-summary="[]" aria-label="${short(n)} round ${i+1}: ${r[n]}. Open review-${i+1}-${n}.md">${verdictEl(r[n])}</button>` : verdictEl(r[n])}</td>`).join("")}</tr>`).join("")}</tbody></table>
    ${d && d.note ? `<p class="footnote">${esc(d.note)}</p>` : ""}`
    : `<p class="faint">No review rounds yet.</p>`;

  const costs = d ? d.costs : [["all agents","",j.cost]];
  const costTotal = costs.reduce((s,c)=>s+c[2],0);
  const costHtml = `<div class="cost-rows"><span class="h">Agent</span><span class="h">Model</span><span class="h" style="text-align:right">Cost</span>
    ${costs.map(c => `<span>${c[0]}</span><span class="model">${c[1]}</span><span style="text-align:right">${usd(c[2])}</span>`).join("")}
    <span class="total">Total</span><span class="total"></span><span class="total" style="text-align:right">${usd(costTotal)}</span></div>
    <p class="footnote">Time: ${dur(NOW - j.created)} since created, ${dur(NOW - j.entered)} in ${j.stage}. Per-stage times are on the timeline.</p>
    <p class="footnote">API-equivalent cost from subagent transcripts, priced with prices_usd_per_mtok. On a subscription this shows relative spend, not your bill. Orchestrator tokens aren't attributed.</p>`;

  const attnBanner = j.attention ? `<div class="banner ${KIND_BADGE[j.attention.kind][0]}" role="status"><span aria-hidden="true">${KIND_BADGE[j.attention.kind][1]}</span><div><div class="b-title">${esc(j.attention.why)}</div><div class="b-body">${esc(j.attention.ask)}</div>
    ${j.stage === "needs-human" ? `<div class="b-body" style="margin-top:6px">${j.pr ? `Merge PR #${j.pr.n} to approve, or send` : "Send"} direction with <code>/factory feedback ${j.id} "…"</code> (runs round ${j.round+1}), or <code>/factory reject ${j.id} "reason"</code>.</div>` : ""}</div></div>` : "";

  return `
    <div class="page-head"><div class="titles">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mono faint">${j.id}</span>${stageBadge(j.stage)}${riskEl(j.risk)}${j.surfaces.map(s=>`<span class="chip">${s}</span>`).join("")}</div>
      <h1 style="margin-top:4px">${esc(j.title)}</h1>
      <dl class="facts">
        <div><dt>Source</dt><dd>${srcLink(j)}</dd></div>
        <div><dt>PR / branch</dt><dd>${j.pr ? `<a href="#" onclick="return false">PR #${j.pr.n}</a>` : j.branch ? `<span class="mono">${j.branch}</span>` : '<span class="faint">none yet</span>'}</dd></div>
        <div><dt>Round</dt><dd>${j.round ? `${j.round} of ${j.maxRounds}` : "—"}</dd></div>
        <div><dt>Elapsed</dt><dd>${dur(NOW-j.created)} <span class="faint">· ${dur(NOW-j.entered)} in stage</span></dd></div>
        <div><dt>Cost</dt><dd>${usd(j.cost)}</dd></div>
        <div><dt>Folder</dt><dd class="mono faint" style="font-size:var(--fs-xs)">factory/jobs/${j.id}/</dd></div>
      </dl></div>
      <div class="links"><a class="btn" href="#" onclick="return false">${fById[fid].backlog.kind === "github" ? "Issue " + j.src : "Backlog file"} ↗</a>${j.pr ? `<a class="btn" href="#" onclick="return false">PR #${j.pr.n} ↗</a>` : ""}<button class="btn" type="button" onclick="navigator.clipboard&&navigator.clipboard.writeText('${fById[fid].path}/factory/jobs/${j.id}/')">Copy job path</button></div>
    </div>
    ${attnBanner}
    <nav class="pipeline" aria-label="Pipeline position">${pipe}</nav>
    <div class="job-layout">
      <section aria-labelledby="tlH"><div class="section-head"><h2 id="tlH">Timeline</h2><span class="count">${tl.filter(x=>!x.round).length} steps · newest last</span></div>
        <ol class="timeline">${items}</ol></section>
      <aside class="side" aria-label="Job details">
        <div class="panel"><h3>Reviews by round</h3>${matrix}</div>
        <div class="panel"><h3>Routing</h3>${j.reviewers.length ? `<div class="card-row">${j.reviewers.map(r=>revEl(r)).join("")}</div><p class="footnote">From risk <b>${j.risk}</b>${j.surfaces.length ? " + surfaces " + j.surfaces.join(", ") : ""} via config.json. Builder: opus.</p>` : `<p class="faint">Not routed yet (intake decides risk and surfaces).</p>`}</div>
        <div class="panel"><h3>Cost and time</h3>${costHtml}</div>
      </aside>
    </div>`;
}

function viewNotFound() { return `<div class="panel state-box"><h2>Not found</h2><p>This factory or job isn't in the registry any more.</p><p><a href="#/">Back to all factories</a></p></div>`; }

function viewLoading() {
  const row = `<tr><td><span class="skel" style="width:110px"></span><span class="skel" style="width:150px;height:9px;margin-top:6px"></span></td><td><span class="skel" style="width:140px"></span></td><td><span class="skel" style="width:90px"></span></td><td><span class="skel" style="width:120px"></span></td><td><span class="skel" style="width:40px;margin-left:auto"></span></td><td><span class="skel" style="width:50px;margin-left:auto"></span></td><td><span class="skel" style="width:60px;margin-left:auto"></span></td></tr>`;
  return `<div class="page-head"><div class="titles"><h1>All factories</h1><div class="sub" role="status"><span>Reading ~/.claude/factory/registry.json…</span></div></div></div>
    <div class="panel"><table class="grid" aria-busy="true"><thead><tr><th>Factory</th><th>Backlog</th><th>Waiting on you</th><th>Now</th><th class="r">Merged 7d</th><th class="r">Spend 7d</th><th class="r">Last activity</th></tr></thead><tbody>${row.repeat(4)}</tbody></table></div>`;
}
function viewEmpty() {
  return `<div class="panel state-box"><h2>No factories yet</h2><p>The registry at <code>~/.claude/factory/registry.json</code> is empty.</p><p>Open a project in Claude Code and run the onboarding skill to set up its factory. It will show up here within a few seconds.</p></div>`;
}
function viewError() {
  return `<div class="panel state-box" role="alert"><h2>Can't read the registry</h2><p><code>~/.claude/factory/registry.json</code>: Unexpected token '}' at line 14, column 3.</p><p>No data has loaded yet in this session. Fix the file and the page recovers on the next poll (every 5 s). Once data has loaded, a later read failure keeps the last good data on screen under an error bar instead of blanking the page.</p><p><button class="btn" type="button">Retry now</button></p></div>`;
}

/* ======================================================================
   Router + shell
   ====================================================================== */
function route() {
  const h = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (h[0] === "f" && h[2] === "j") return { name:"job", fid:h[1], jid:h[3] };
  if (h[0] === "f") return { name:"factory", fid:h[1] };
  return { name:"overview" };
}
function crumbs(r) {
  const parts = [`<a href="#/"${r.name==="overview"?' aria-current="page"':""}>All</a>`];
  if (r.fid) parts.push(`<span class="sep">/</span>`, `<a href="#/f/${r.fid}"${r.name==="factory"?' aria-current="page"':""}>${r.fid}</a>`);
  if (r.jid) parts.push(`<span class="sep">/</span>`, `<span aria-current="page" class="mono">${r.jid}</span>`);
  return parts.join(" ");
}
function render() {
  const r = route();
  document.getElementById("crumbs").innerHTML = crumbs(r);
  const n = attentionItems(null).filter(i => YOUR_MOVE.has(i.kind)).length;
  const ac = document.getElementById("attnCount");
  ac.innerHTML = `▲ <span class="num">${n}</span> blocked on you`; ac.style.display = (demoState === "live" && n) ? "" : "none";
  const poll = document.getElementById("poll");
  poll.className = "poll" + (demoState === "error" ? " is-error" : demoState === "loading" ? " is-paused" : "");
  document.getElementById("pollAge").textContent = demoState === "error" ? "read failed 5s ago" : demoState === "loading" ? "loading…" : "4s ago";
  let html;
  if (demoState === "loading") html = viewLoading();
  else if (demoState === "empty") html = viewEmpty();
  else if (demoState === "error") html = viewError();
  else html = r.name === "job" ? viewJob(r.fid, r.jid) : r.name === "factory" ? viewFactory(r.fid) : viewOverview();
  const app = document.getElementById("app");
  app.innerHTML = html;
  const cur = app.querySelector('.pipeline [aria-current="step"]');
  if (cur) cur.parentElement.scrollLeft = cur.offsetLeft - cur.parentElement.offsetLeft - 24;
  document.title = (r.jid ? r.jid + " · " : r.fid ? r.fid + " · " : "") + "Factory Dashboard";
}

const stateBtns = document.getElementById("stateBtns");
["live","loading","empty","error"].forEach(s => {
  const b = document.createElement("button"); b.type = "button"; b.textContent = s; b.setAttribute("aria-pressed", s === demoState);
  b.onclick = () => { demoState = s; stateBtns.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); };
  stateBtns.append(b, " ");
});

/* Theme: system → light → dark */
const themes = ["system","light","dark"]; let ti = 0;
try { const saved = localStorage.getItem("factory-theme"); if (themes.includes(saved)) ti = themes.indexOf(saved); } catch (e) {}
function applyTheme() {
  const th = themes[ti];
  if (th === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", th);
  document.getElementById("themeLabel").textContent = th[0].toUpperCase() + th.slice(1);
  document.getElementById("themeBtn").setAttribute("aria-label", "Theme: " + th + ". Click to change");
  try { localStorage.setItem("factory-theme", th); } catch (e) {}
}
document.getElementById("themeBtn").onclick = () => { ti = (ti+1) % 3; applyTheme(); };
applyTheme();

/* File dialog */
const dlg = document.getElementById("fileDlg");
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-file]"); if (!b) return;
  const file = b.dataset.file, summary = JSON.parse(b.dataset.summary);
  document.getElementById("dlgTitle").textContent = file;
  document.getElementById("dlgMeta").textContent = "factory/jobs/" + b.dataset.job + "/";
  const isLog = file.endsWith(".log"), key = b.dataset.job + ":" + file;
  document.getElementById("dlgBody").innerHTML = isLog
    ? `<pre class="gatelog" style="border:0;border-radius:6px">${GATELOGS[key] || "checks.sh output…"}</pre>`
    : `<h2>Summary</h2>${summary.length ? `<ul>${summary.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>` : `<p class="faint">(the file's own 3–5 summary bullets)</p>`}
       <h2>Detail</h2><p>The rest of <code>${esc(file)}</code> renders here as Markdown: the agent's reasoning, the diff hunks it refers to, and any questions it raised.</p>
       <pre><code>// e.g. player/tuning.ron
DashTuning(
    cooldown_s: 0.35,
    reset_on_wall_contact: false,
)</code></pre>
       <h2>Verdict</h2><pre><code>Verdict: PASS</code></pre><p class="faint">Plain <code>Key: VALUE</code> lines, parsed by factory/bin/job.</p>`;
  dlg.showModal(); document.getElementById("dlgClose").focus();
});
document.getElementById("dlgClose").onclick = () => dlg.close();
document.getElementById("dlgCopy").onclick = () => { try { navigator.clipboard.writeText(document.getElementById("dlgMeta").textContent + document.getElementById("dlgTitle").textContent); } catch (e) {} };

window.addEventListener("hashchange", () => { render(); document.getElementById("app").focus({preventScroll:true}); window.scrollTo(0,0); });
render();
</script>
